<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junfan Huang</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<!-- Top Navigation Bar -->
<header class="top-header">
  <div class="header-inner">
    <a href="#" class="site-title" onclick="event.preventDefault(); navigate('blog');">Junfan Huang</a>
    <nav class="top-nav">
      <a href="#" data-page="research">Research</a>
      <a href="#" data-page="teaching">Teaching</a>
      <div class="dropdown">
        <a href="#" data-page="tools">Tools <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <div class="dropdown-content" id="tools-dropdown"></div>
      </div>
      <a href="#" data-page="projects">Projects</a>
      <a href="#" data-page="blog">Blog</a>
      <a href="#" data-page="ai" class="nav-ai">AI</a>
    </nav>
    <div class="header-actions">
      <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">\u4e2d/EN</button>
      <button class="search-toggle" onclick="toggleSearchOverlay()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Search Overlay -->
<div class="search-overlay" id="search-overlay">
  <div class="search-overlay-inner">
    <input type="text" class="search-overlay-input" id="search-overlay-input" placeholder="Search posts..." onkeyup="handleOverlaySearch(event)">
    <button class="search-overlay-close" onclick="toggleSearchOverlay()">&times;</button>
  </div>
</div>

<!-- Main Layout -->
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-card">
      <div class="avatar-wrap">
        <img src="assets/avatar.png" alt="Avatar" class="avatar" onerror="this.style.display='none'">
      </div>
      <h2 class="sidebar-name">Junfan Huang</h2>
      <p class="sidebar-bio">A not-so-boring Researcher who like coding and Coca-Cola.</p>
      <div class="social-row">
        <a href="#" class="social-icon si-web" title="Website">\ud83c\udf10</a>
        <a href="https://github.com/xihajun" class="social-icon si-github" title="GitHub">\u2b50</a>
        <a href="#" class="social-icon si-chat" title="Contact">\ud83d\udcac</a>
        <a href="#" class="social-icon si-rss" title="RSS">\ud83d\udce1</a>
      </div>
    </div>
    <div class="sidebar-section">
      <h4 class="sidebar-heading" data-i18n="recent">Recent Posts</h4>
      <div id="sidebar-posts"></div>
    </div>
  </aside>

  <main class="main-area">
    <div id="page-content"></div>
  </main>
</div>

<footer class="footer">
  <p>Powered by Pure HTML \u00b7 Built with \u2764\ufe0f</p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/toc.js"></script>
<script src="js/router.js"></script>
<script src="js/main.js"></script>
</body>
</html>
